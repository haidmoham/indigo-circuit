<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PTCG Scouting{% endblock %}</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #e63946;
      --text: #e8eaf0;
      --muted: #8b8fa8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    nav {
      display: flex; align-items: center; gap: 2rem;
      padding: 1rem 2rem; border-bottom: 1px solid var(--border);
    }
    nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    nav a:hover, nav a.active { color: var(--text); }
    nav .logo { font-weight: 700; color: var(--accent); margin-right: auto; }
    main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 1.5rem;
    }
    .search-bar {
      display: flex; gap: 0.5rem; margin-bottom: 2rem;
    }
    .search-bar input {
      flex: 1; padding: 0.75rem 1rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 1rem;
    }
    .search-bar input:focus { outline: none; border-color: var(--accent); }
    .stat-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem;
    }
    .stat { text-align: center; }
    .stat .value { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .stat .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <nav>
    <span class="logo">PTCG Scout</span>
    <a href="/">Search</a>
    <a href="/meta">Meta</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <script>{% block scripts %}{% endblock %}</script>
</body>
</html>
