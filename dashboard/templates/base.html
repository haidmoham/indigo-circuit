<!DOCTYPE html>
<html lang="en" data-atmosphere="garden" data-motion="paused">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Indigo Circuit{% endblock %}</title>

  <!-- Open Graph / social embeds -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="Indigo Circuit">
  <meta property="og:title"       content="{% block og_title %}Indigo Circuit{% endblock %}">
  <meta property="og:description" content="{% block og_description %}welcome to the circuit{% endblock %}">
  <meta property="og:image"       content="{{ request.host_url }}og-image.png">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="{% block tw_title %}Indigo Circuit{% endblock %}">
  <meta name="twitter:description" content="{% block tw_description %}welcome to the circuit{% endblock %}">
  <meta name="twitter:image"       content="{{ request.host_url }}og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='atmosphere.css') }}">
  <script src="{{ url_for('static', filename='atmosphere.js') }}"></script>

  <link rel="icon" type="image/png" href="/static/favicon.png">

  <script>
    // ── Shared sprite / theme helpers ────────────────────────────────────
    const TYPE_THEMES = {
      'charizard':      { c: '#e7ac90', g: 'rgba(255,109,0,0.25)',  label: 'Fire'     },
      'entei':          { c: '#e7ac90', g: 'rgba(255,109,0,0.25)',  label: 'Fire'     },
      'infernape':      { c: '#e6a291', g: 'rgba(255,69,0,0.25)',   label: 'Fire'     },
      'blaziken':       { c: '#e6a291', g: 'rgba(255,69,0,0.25)',   label: 'Fire'     },
      'gyarados':       { c: '#9bbdd7', g: 'rgba(30,144,255,0.25)', label: 'Water'    },
      'kyogre':         { c: '#9bbdd7', g: 'rgba(30,144,255,0.25)', label: 'Water'    },
      'primarina':      { c: '#9acbd0', g: 'rgba(41,182,246,0.25)', label: 'Water'    },
      'greninja':       { c: '#9acbd0', g: 'rgba(41,182,246,0.25)', label: 'Water'    },
      'ogerpon':        { c: '#acd3b1', g: 'rgba(87,242,135,0.22)', label: 'Grass'    },
      'terapagos':      { c: '#a2c1a0', g: 'rgba(76,175,80,0.25)',  label: 'Grass'    },
      'serperior':      { c: '#acd3b1', g: 'rgba(87,242,135,0.22)', label: 'Grass'    },
      'raging-bolt':    { c: '#ead4a2', g: 'rgba(255,214,0,0.28)',  label: 'Electric' },
      'pikachu':        { c: '#ead4a2', g: 'rgba(255,214,0,0.28)',  label: 'Electric' },
      'miraidon':       { c: '#c0b9d6', g: 'rgba(179,136,255,0.25)',label: 'Electric' },
      'tapu-koko':      { c: '#ead4a2', g: 'rgba(255,214,0,0.28)',  label: 'Electric' },
      'gardevoir':      { c: '#d8b3c7', g: 'rgba(224,64,251,0.25)', label: 'Psychic'  },
      'mewtwo':         { c: '#d8b3c7', g: 'rgba(224,64,251,0.25)', label: 'Psychic'  },
      'mew':            { c: '#e0b1bb', g: 'rgba(244,143,177,0.25)',label: 'Psychic'  },
      'espathra':       { c: '#d8b3c7', g: 'rgba(224,64,251,0.25)', label: 'Psychic'  },
      'dragapult':      { c: '#b5b6d8', g: 'rgba(124,77,255,0.28)', label: 'Dragon'   },
      'regidrago':      { c: '#b5b6d8', g: 'rgba(124,77,255,0.28)', label: 'Dragon'   },
      'dragonite':      { c: '#dbbe95', g: 'rgba(255,143,0,0.25)',  label: 'Dragon'   },
      'rayquaza':       { c: '#a9c8b4', g: 'rgba(102,187,106,0.25)',label: 'Dragon'   },
      'roaring-moon':   { c: '#b7abc9', g: 'rgba(74,20,140,0.35)',  label: 'Dark'     },
      'dusknoir':       { c: '#a4bcc5', g: 'rgba(84,110,122,0.3)',  label: 'Ghost'    },
      'gengar':         { c: '#c0b0d1', g: 'rgba(123,31,162,0.3)',  label: 'Ghost'    },
      'darkrai':        { c: '#b5b7c1', g: 'rgba(100,100,120,0.4)', label: 'Dark'     },
      'weavile':        { c: '#a4bcc5', g: 'rgba(84,110,122,0.3)',  label: 'Dark'     },
      'lucario':        { c: '#a3b9d6', g: 'rgba(21,101,192,0.28)', label: 'Fighting' },
      'lucario-mega':   { c: '#a3b9d6', g: 'rgba(21,101,192,0.28)', label: 'Fighting' },
      'hariyama':       { c: '#d9ab91', g: 'rgba(230,81,0,0.28)',   label: 'Fighting' },
      'lopunny':        { c: '#cec0ae', g: 'rgba(188,170,164,0.28)',label: 'Normal'   },
      'lopunny-mega':   { c: '#cec0ae', g: 'rgba(188,170,164,0.28)',label: 'Normal'   },
      'dudunsparce':    { c: '#cec0ae', g: 'rgba(188,170,164,0.28)',label: 'Normal'   },
    };

    const SPRITE_BASE = 'https://r2.limitlesstcg.net/pokemon/gen9/';

    // Archetypes named after abilities/items rather than Pokémon.
    // Add entries here whenever a new one surfaces.
    const DECK_ALIASES = {
      'festival lead':  'applin',      // Applin ability
      'sparkling aria': 'primarina',   // Primarina ability
      'future shift':   'iron-valiant',
    };

    const COMPOUND_NAMES = [
      'raging-bolt','iron-hands','iron-valiant','iron-moth','iron-jugulis',
      'iron-treads','iron-boulder','iron-crown','iron-leaves','iron-thorns',
      'flutter-mane','sandy-shocks','walking-wake','chi-yu','chien-pao',
      'ting-lu','wo-chien','great-tusk','brute-bonnet','scream-tail',
      'slither-wing','roaring-moon','koraidon','miraidon',
    ];

    function buildSprite(deckName) {
      if (!deckName) return null;
      const lower = deckName.toLowerCase().trim();
      // Ability/item-named archetypes that don't match any Pokémon name
      for (const [alias, target] of Object.entries(DECK_ALIASES)) {
        if (lower === alias || lower.startsWith(alias + ' ') || lower.startsWith(alias + '-')) {
          return SPRITE_BASE + target + '.png';
        }
      }
      let s = lower
        .replace(/\b\w+'\s*s\s+/g, '')          // strip trainer possessives: "Rocket's ", "N's "
        .replace(/\bmega\b/g, '')                // strip Mega prefix (Mega Starmie → starmie)
        .replace(/\bex\b|\bvstar\b|\bvmax\b|\bgx\b|\bv\b/g, '')
        .replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
      for (const c of COMPOUND_NAMES) {
        if (s.startsWith(c)) return SPRITE_BASE + c + '.png';
      }
      return SPRITE_BASE + s.split('-')[0] + '.png';
    }

    function spriteKey(url) {
      if (!url) return null;
      return url.split('/').pop().replace('.png','').replace('.jpg','');
    }

    function getSprite(deckSprite, deckName) {
      return deckSprite || buildSprite(deckName);
    }

    function getTheme(player) {
      const url = getSprite(player.TOP_DECK_SPRITE, player.TOP_DECK_NAME);
      const key = spriteKey(url);
      if (key && TYPE_THEMES[key]) return TYPE_THEMES[key];
      if (player.TOP_DECK_NAME) {
        const name = player.TOP_DECK_NAME.toLowerCase();
        for (const [k, v] of Object.entries(TYPE_THEMES)) {
          if (name.includes(k.replace('-',' ')) || name.includes(k)) return v;
        }
      }
      return { c: '#b5b6d8', g: 'rgba(108,71,245,0.25)', label: '' };
    }

    function limitlesstcg(name) {
      return `https://limitlesstcg.com/players?q=${encodeURIComponent(name)}`;
    }

    function countryFlag(code) {
      if (!code || code.length !== 2) return '';
      const base = 0x1F1E6 - 65;
      try {
        return String.fromCodePoint(
          base + code.toUpperCase().charCodeAt(0),
          base + code.toUpperCase().charCodeAt(1)
        );
      } catch(e) { return ''; }
    }

    function countryDisplay(code) {
      if (!code) return '';
      const flag = countryFlag(code);
      return flag ? `${flag} ${code}` : code;
    }

    // ── Global loading bar ───────────────────────────────────────────────
    let _loaderCount = 0;
    function _startLoad() {
      _loaderCount++;
      const el = document.getElementById('global-loader');
      if (el) { el.classList.remove('done'); el.classList.add('loading'); }
    }
    function _endLoad() {
      _loaderCount = Math.max(0, _loaderCount - 1);
      if (_loaderCount > 0) return;
      const el = document.getElementById('global-loader');
      if (!el) return;
      el.classList.remove('loading');
      el.classList.add('done');
      setTimeout(() => el.classList.remove('done'), 400);
    }

    // Wrap window.fetch to auto-show/hide the bar
    (function () {
      const _orig = window.fetch.bind(window);
      window.fetch = function (...args) {
        _startLoad();
        return _orig(...args).finally(_endLoad);
      };
    })();

    // ── Trainer Card modal ───────────────────────────────────────────────
    function _cardTierStyle(title) {
      const t = (title || '').toLowerCase();
      if (t.includes('champion')) {
        return {
          bg: 'linear-gradient(160deg, #1a1200 0%, #2a1800 100%)',
          border: '#ead4a2',
          glow: 'rgba(255,214,0,0.35)',
        };
      }
      if (t.includes('elite')) {
        return {
          bg: 'linear-gradient(160deg, #0e0830 0%, #1a1040 100%)',
          border: '#b5b6d8',
          glow: 'rgba(124,77,255,0.35)',
        };
      }
      return {
        bg: 'linear-gradient(160deg, #0d1520 0%, #111a2a 100%)',
        border: '#9acbd0',
        glow: 'rgba(41,182,246,0.25)',
      };
    }

    function _renderCard(p) {
      const title = p.TITLE || p.title || '';
      const name  = p.PLAYER_NAME || p.player_name || '';
      const country = p.COUNTRY || p.country || '';
      const rank  = p.RANK || p.rank;
      const atp   = p.ATP_SCORE || p.atp_score;
      const wr    = p.WIN_RATE_PCT || p.win_rate_pct;
      const top8s = p.TOP8S || p.top8s;
      const best  = p.BEST_PLACING || p.best_placing;
      const majors= p.MAJORS_COUNTED || p.majors_counted;
      const worldsT8 = p.WORLDS_TOP8S || p.worlds_top8s || 0;
      const deckName = p.TOP_DECK_NAME || p.top_deck_name || '';
      const deckSprite = p.TOP_DECK_SPRITE || p.top_deck_sprite || null;

      const sprite = getSprite(deckSprite, deckName);
      const themePlayer = {
        TOP_DECK_SPRITE: deckSprite,
        TOP_DECK_NAME: deckName,
      };
      const theme = getTheme(themePlayer);
      const tier  = _cardTierStyle(title);

      const gymLeaderOf = p.GYM_LEADER_OF || p.gym_leader_of || '';
      const playerId = p.PLAYER_ID || p.player_id || null;
      const titleBadge = [
        title
          ? (title.toLowerCase().includes('champion')
              ? `<span class="badge badge-champion">🏆 ${title}</span>`
              : title.toLowerCase().includes('elite')
                ? `<span class="badge badge-elite4">${title}</span>`
                : '')
          : '',
        gymLeaderOf
          ? `<span class="badge badge-gym">🏅 ${gymLeaderOf} Leader</span>`
          : '',
      ].filter(Boolean).join(' ');

      const rankColor = rank === 1 ? 'var(--gold)' : (rank <= 5 ? 'var(--indigo)' : 'var(--muted)');

      return `
        <div style="text-align:center;margin-bottom:1rem">
          <span style="font-size:2rem;font-weight:900;color:${rankColor};line-height:1">#${rank}</span>
          ${titleBadge ? `<div style="margin-top:0.4rem">${titleBadge}</div>` : ''}
        </div>
        ${sprite ? `
          <div style="text-align:center;margin-bottom:0.75rem">
            <img src="${sprite}" alt="${deckName}"
              style="width:96px;height:96px;object-fit:contain;image-rendering:pixelated;
                     filter:drop-shadow(0 0 14px ${theme.c}99);"
              onerror="this.style.display='none'">
            ${deckName ? `<div style="font-size:0.7rem;font-weight:800;color:${theme.c};
                text-transform:uppercase;letter-spacing:0.07em;margin-top:0.3rem">${deckName}</div>` : ''}
          </div>` : ''}
        <div style="text-align:center;margin-bottom:1rem">
          <div style="font-size:1.5rem;font-weight:900;color:#fff;line-height:1.1">${name}</div>
          ${country ? `<div style="font-size:0.8rem;color:var(--muted);margin-top:0.25rem;font-weight:600">${countryDisplay(country)}</div>` : ''}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem;
                    padding:0.75rem 0;border-top:1px solid rgba(255,255,255,0.08);
                    border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:0.75rem">
          <div style="text-align:center">
            <div style="font-size:1.25rem;font-weight:900;color:${theme.c}">${atp != null ? Number(atp).toFixed(1) : '—'}</div>
            <div style="font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-top:0.15rem">ATP</div>
          </div>
          <div style="text-align:center">
            <div style="font-size:1.25rem;font-weight:900;color:var(--green)">${wr != null ? Number(wr).toFixed(2) + '%' : '—'}</div>
            <div style="font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-top:0.15rem">Win Rate</div>
          </div>
          <div style="text-align:center">
            <div style="font-size:1.25rem;font-weight:900;color:var(--electric)">${top8s ?? '—'}</div>
            <div style="font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-top:0.15rem">Top 8s</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem;margin-bottom:1rem">
          <div style="text-align:center">
            <div style="font-size:1.1rem;font-weight:900;color:var(--electric)">${best != null ? '#' + best : '—'}</div>
            <div style="font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-top:0.1rem">Best</div>
          </div>
          <div style="text-align:center">
            <div style="font-size:1.1rem;font-weight:900;color:var(--violet)">${majors ?? '—'}</div>
            <div style="font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-top:0.1rem">Majors</div>
          </div>
          <div style="text-align:center">
            <div style="font-size:1.1rem;font-weight:900;color:var(--gold)">${worldsT8}</div>
            <div style="font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-top:0.1rem">Worlds T8</div>
          </div>
        </div>
        <div style="display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap">
          <a href="/player/${encodeURIComponent(name)}"
             style="font-size:0.75rem;font-weight:700;color:var(--violet);text-decoration:none;
                    background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.3);
                    border-radius:6px;padding:0.35rem 0.75rem;transition:background 0.15s;"
             onmouseover="this.style.background='rgba(99,102,241,0.22)'"
             onmouseout="this.style.background='rgba(99,102,241,0.12)'">
            View Profile
          </a>
          <a href="${limitlesstcg(name)}" target="_blank" rel="noopener"
             style="font-size:0.75rem;font-weight:700;color:var(--muted);text-decoration:none;
                    border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:0.35rem 0.75rem;
                    transition:color 0.15s,border-color 0.15s;"
             onmouseover="this.style.color='var(--text)';this.style.borderColor='rgba(255,255,255,0.3)'"
             onmouseout="this.style.color='var(--muted)';this.style.borderColor='rgba(255,255,255,0.12)'">
            &#8599; Limitless TCG
          </a>
        </div>`;
    }

    async function showTrainerCard(playerName) {
      const overlay = document.getElementById('card-overlay');
      const inner   = document.getElementById('card-inner');
      const content = document.getElementById('card-content');

      // Reset to loading state
      inner.style.background = 'var(--surface)';
      inner.style.borderColor = 'var(--border)';
      inner.style.boxShadow = 'none';
      content.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--muted);
        font-size:0.8rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase">Loading…</div>`;
      overlay.style.display = 'flex';

      try {
        const res = await fetch(`/api/player-card/${encodeURIComponent(playerName)}`);
        if (!res.ok) {
          content.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--muted);
            font-size:0.8rem">Player not in current rankings.</div>`;
          return;
        }
        const p = await res.json();
        const title = p.TITLE || p.title || '';
        const tier = _cardTierStyle(title);
        inner.style.background = tier.bg;
        inner.style.borderColor = tier.border;
        inner.style.boxShadow = `0 0 40px ${tier.glow}`;
        content.innerHTML = _renderCard(p);
      } catch (e) {
        content.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--red);
          font-size:0.8rem">Error loading card.</div>`;
      }
    }

    function closeTrainerCard() {
      document.getElementById('card-overlay').style.display = 'none';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeTrainerCard();
    });
  </script>
</head>
<body>

          <path d="M-76-100Q-60-95-48-75L-41-48L-62-47ZM68-99L54-48L32-43L39-68Z" fill="#344137"/>
          <ellipse cx="-29" cy="52" rx="5" ry="7" fill="#344137"/><ellipse cx="26" cy="52" rx="5" ry="7" fill="#344137"/>

          <path d="M-4 68L3 68L0 72M-13 80Q-6 87 0 80Q6 87 13 80" fill="none" stroke="#344137" stroke-width="2.5" stroke-linecap="round"/>

      </g>
      <g class="scene-night">
        <circle class="scene-moon" cx="1250" cy="250" r="51"/>
        <g class="habitat-trees"><path d="M1290 1000V510L1200 545L1273 485L1218 468L1285 405L1245 390L1305 292L1360 394L1329 410L1401 479L1335 482L1413 553L1330 519V1000Z"/><path d="M45 1000V568L-25 590L30 521L-10 525L50 423L110 530L76 524L132 587L68 567V1000Z"/></g>
        <!-- Gengar's ears, grin, and red eyes emerge at the edge of the forest. -->
        <g class="habitat-pokemon gengar scene-drift" transform="translate(1250 665)">
          <path d="M-74 12L-96-81L-34-50L-18-73L0-56L25-82L40-48L96-81L77 17L105 50L84 64Q97 106 51 120L45 141L15 123H-29L-59 140L-61 114Q-98 95-86 61L-109 47Z" fill="#9a8cb3"/>
          <path d="M-60 10L-13 29L-51 34ZM60 10L13 29L51 34Z" fill="#e9918d"/>
          <path d="M-55 52Q0 78 57 49Q26 112-26 91Q-49 79-55 52Z" fill="#e8debf"/>

  <script>
    // ── Active nav link ──────────────────────────────────────────────────────
    (function () {
      const path = window.location.pathname;
      document.querySelectorAll('nav a:not(.logo)').forEach(function (a) {
        const href = a.getAttribute('href');
        if (!href) return;
        if (href === '/' ? path === '/' : path === href || path.startsWith(href + '/')) {
          a.classList.add('active');
          a.setAttribute('aria-current', 'page');
        }
      });
    })();
  </script>

  <!-- Trainer Card modal -->
  <div id="card-overlay" onclick="if(event.target===this)closeTrainerCard()"
       style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75);
              backdrop-filter:blur(6px); z-index:1000; align-items:center; justify-content:center;">
    <div id="card-inner" style="max-width:320px; width:90%; position:relative;
         border-radius:18px; padding:1.75rem; border:2px solid; cursor:default;">

              style="position:absolute;top:0.75rem;right:0.75rem;background:none;
                     border:none;color:rgba(255,255,255,0.4);font-size:1.2rem;cursor:pointer;">&#10005;</button>
      <div id="card-content"></div>
    </div>
