version: 2

sources:
  - name: ptcg_raw
    schema: raw
    tables:
      - name: tournaments
        description: Raw tournament metadata from the Limitless Play API.
        columns:
          - name: id
            tests: [not_null, unique]
          - name: game
            tests: [not_null]

      - name: standings
        description: Per-player final standings for each tournament.
        columns:
          - name: tournament_id
            tests: [not_null]
          - name: player_username
            tests: [not_null]

      - name: matches
        description: Round-by-round pairings and results for each tournament.
        columns:
          - name: tournament_id
            tests: [not_null]
          - name: round
            tests: [not_null]

      - name: decklists
        description: Individual card entries per player per tournament. Available without API key.
        columns:
          - name: tournament_id
            tests: [not_null]
          - name: player_username
            tests: [not_null]
          - name: card_name
            tests: [not_null]

      - name: glicko_ratings
        description: Glicko-2 ratings computed by ingest/glicko.py — one row per player.
        columns:
          - name: player_username
            tests: [not_null, unique]

      - name: major_tournaments
        description: Curated major events (Regionals, ICs, Worlds) scraped from Limitless Labs.
        columns:
          - name: labs_id
            tests: [not_null, unique]

      - name: major_standings
        description: Player standings for each major tournament scraped from Limitless Labs.
        columns:
          - name: labs_tournament_id
            tests: [not_null]
