version: 2

models:
  - name: player_tournament_history
    description: One row per player per tournament. Foundation for all player-level analytics.
    columns:
      - name: player_username
        tests: [not_null]
      - name: tournament_id
        tests: [not_null]
      - name: normalized_placement
        description: placing / player_count — 0.0 is 1st, 1.0 is last. Used for consistency scoring.

  - name: players
    description: Career summary per player — one row per unique player_username.
    columns:
      - name: player_username
        tests: [not_null, unique]
      - name: consistency_score
        description: >
          1 minus the standard deviation of normalized_placement across tournaments.
          Higher = more consistent finishes. Null if only one tournament played.

  - name: player_archetype_history
    description: Archetype affinity per player — how often they play each deck and how it performs.
    columns:
      - name: player_username
        tests: [not_null]
      - name: deck_id
        tests: [not_null]

  - name: player_vs_player
    description: Head-to-head record between all player pairs who have faced each other.
    columns:
      - name: player_username
        tests: [not_null]
      - name: opponent_username
        tests: [not_null]

  - name: gym_leaders
    description: >
      Top-10 specialists per archetype, ranked by season-weighted placement score
      scaled by log(tournament_count). Minimum 3 tournaments to qualify.
      archetype_rank = 1 is the current Gym Leader for that deck.
    columns:
      - name: archetype
        tests: [not_null]
      - name: player_username
        tests: [not_null]
      - name: is_gym_leader
        description: True for archetype_rank = 1.

  - name: major_card_archetype_stats
    description: >
      Per-archetype card inclusion rates from major tournament (Regionals/ICs/Worlds) decklists.
      Mirrors card_archetype_stats but uses major_decklists + major_standings as source.
    columns:
      - name: deck_id
        tests: [not_null]
      - name: card_name
        tests: [not_null]

  - name: card_match_splits
    description: >
      Per-round win/loss splits by card presence for Bayesian EV calculation.
      One row per (deck_id, card_name, opponent_deck_id). Powers EV Lab (online source).
      w_with/l_with = matches where player ran the card;
      w_without/l_without = same archetype without it.
    columns:
      - name: deck_id
        tests: [not_null]
      - name: card_name
        tests: [not_null]
      - name: opponent_deck_id
        tests: [not_null]

  - name: major_card_match_splits
    description: >
      Per-round win/loss splits for major tournaments (Regionals/ICs/Worlds).
      Mirrors card_match_splits but uses raw.major_* tables. Powers EV Lab (majors source).
    columns:
      - name: deck_id
        tests: [not_null]
      - name: card_name
        tests: [not_null]
      - name: opponent_deck_id
        tests: [not_null]

  - name: card_copy_splits
    description: >
      Per-round win/loss splits by copy count for online tournaments.
      One row per (deck_id, card_name, opponent_deck_id, copy_count).
      copy_count = 0 means ran the archetype without the card.
      Powers EV Lab copy-count modeling (online source).
    columns:
      - name: deck_id
        tests: [not_null]
      - name: card_name
        tests: [not_null]
      - name: opponent_deck_id
        tests: [not_null]
      - name: copy_count
        tests: [not_null]

  - name: major_card_copy_splits
    description: >
      Per-round win/loss splits by copy count for major tournaments (Regionals/ICs/Worlds).
      Mirrors card_copy_splits but uses raw.major_* tables.
      Powers EV Lab copy-count modeling (majors source).
    columns:
      - name: deck_id
        tests: [not_null]
      - name: card_name
        tests: [not_null]
      - name: opponent_deck_id
        tests: [not_null]
      - name: copy_count
        tests: [not_null]

  - name: card_archetype_stats
    description: >
      Per-archetype card inclusion rates and counts. Powers tech card detection
      (is_tech_card = inclusion_rate < 30%) and meta card analysis.
    columns:
      - name: deck_id
        tests: [not_null]
      - name: card_name
        tests: [not_null]
      - name: inclusion_rate
        description: Share of archetype lists containing this card (0.0–1.0).
